# ── Render.com Deployment Config ──────────────────────────────────
# Put this file in the ROOT of your project (next to package.json)
# Then connect your GitHub repo on render.com → New Web Service

services:
  - type: web
    name: finalfinalprojbus
    env: node
    plan: free
    rootDir: app/backend
    buildCommand: npm install
    startCommand: node server.js
    healthCheckPath: /health

    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGO_URI
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: DRIVER_PASS
        sync: false
      - key: MAIL_USER
        sync: false
      - key: MAIL_PASS
        sync: false